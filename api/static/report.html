<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Report — Incident Agent</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="app-shell">
        <aside class="sidebar no-print">
            <div class="sidebar-brand">
                <div class="brand-icon">⚡</div>
                <span class="brand-text">Incident Agent</span>
                <span class="brand-tag">AI</span>
            </div>
            <nav class="sidebar-nav">
                <a href="/" class="nav-item">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
                    Dashboard
                </a>
                <a href="/investigate" class="nav-item">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                    Investigate
                </a>
            </nav>
            <div class="sidebar-footer">
    <p style="font-weight:600; color:var(--text-secondary); margin-bottom:0.3rem;">Built by Tulaja Patil</p>
    <p>Multi-agent pipeline<br>LangGraph · Gemini · ChromaDB</p>
</div>
        </aside>

        <main class="main-content">
            <div class="page-header no-print">
                <div>
                    <h1>Incident Report</h1>
                    <div id="report-meta" style="margin-top:0.35rem;"></div>
                </div>
                <div style="display:flex; gap:0.6rem;">
                    <button onclick="window.print()" class="btn btn-outline">
                        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                        Download PDF
                    </button>
                    <a href="/" class="btn btn-secondary" style="text-decoration:none;">← Dashboard</a>
                </div>
            </div>

            <div class="report-layout">
                <div id="report-body" class="report-content">
                    <p style="color:var(--text-muted);">Loading report...</p>
                </div>
                <aside id="report-sidebar" class="report-sidebar" style="display:none;"></aside>
            </div>
        </main>
    </div>

    <script src="/static/api.js"></script>
    <script>
        async function loadReport() {
            const params = new URLSearchParams(window.location.search);
            const id = params.get("id");
            if (!id) {
                document.getElementById("report-body").innerHTML =
                    '<div class="empty-state"><p style="color:var(--danger);">No incident ID. <a href="/">Go to dashboard</a></p></div>';
                return;
            }

            try {
                const inc = await fetchIncident(id);

                document.getElementById("report-meta").innerHTML = `
                    <div class="report-meta" style="display:flex;align-items:center;gap:0.6rem;flex-wrap:wrap;color:var(--text-secondary);font-size:0.8rem;">
                        <span style="font-family:'JetBrains Mono',monospace;font-weight:600;">#${inc.id}</span>
                        <span style="color:var(--border);">·</span>
                        ${severityBadge(inc.severity)}
                        <span style="color:var(--border);">·</span>
                        <span>${inc.processing_time?.toFixed(1) || '?'}s</span>
                        <span style="color:var(--border);">·</span>
                        <span>${inc.timestamp || ''}</span>
                    </div>`;

                document.getElementById("report-body").innerHTML = renderMarkdown(inc.report);

                const sidebar = document.getElementById("report-sidebar");
                sidebar.style.display = "block";
                sidebar.innerHTML = `
                    <h3>Investigation Details</h3>
                    <div class="meta-item">
                        <div class="meta-label">Error Type</div>
                        <div class="meta-value">${inc.error_type || 'Unknown'}</div>
                    </div>
                    <div class="meta-item">
                        <div class="meta-label">Affected System</div>
                        <div class="meta-value"><code>${inc.affected_system || 'unknown'}</code></div>
                    </div>
                    <div class="meta-item">
                        <div class="meta-label">Severity</div>
                        <div class="meta-value">${severityBadge(inc.severity)}</div>
                    </div>
                    <div class="meta-item">
                        <div class="meta-label">Confidence</div>
                        <div class="meta-value">${((inc.severity_confidence || 0) * 100).toFixed(0)}%</div>
                    </div>
                    <div class="meta-item">
                        <div class="meta-label">Pipeline Time</div>
                        <div class="meta-value"><code>${inc.processing_time?.toFixed(1) || '?'}s</code></div>
                    </div>
                    <div class="meta-item">
                        <div class="meta-label">Agents Used</div>
                        <div class="meta-value" style="font-size:0.78rem;line-height:1.7;">
                            ${AGENTS.map(a => a.icon + ' ' + a.label).join('<br>')}
                        </div>
                    </div>
                    <div class="meta-item" style="margin-top:1.25rem;padding-top:0.75rem;border-top:1px solid var(--border);">
                        <div class="meta-label">Timestamp</div>
                        <div class="meta-value" style="font-size:0.78rem;">${inc.timestamp || ''}</div>
                    </div>`;
            } catch (err) {
                document.getElementById("report-body").innerHTML =
                    `<div class="empty-state"><p style="color:var(--danger);">Failed: ${err.message}</p></div>`;
            }
        }
        loadReport();
    </script>
</body>
</html>
